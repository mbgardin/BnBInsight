[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bnbinsight"
version = "0.1.0"
description = "Airbnb short-term rental pricing analysis package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Monte Gardiner" },
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.28",
]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]